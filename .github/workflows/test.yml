name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: example
          - os: macos-latest
            exe: example
          # Windows requires an explicit executable extension on -out:
          - os: windows-latest
            exe: example.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-07

      - name: Build examples
        run: odin build examples -out:${{ matrix.exe }}

      - name: Run spec tests
        working-directory: validation
        run: odin test odin_spec_test.odin -file
